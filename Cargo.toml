[package]
name = "peakcast"
version.workspace = true
edition.workspace = true
description = "Mountain weather for the places you go: finds them, keeps them and prints their forecast."
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }

[workspace]
members = ["bar", "map"]
# The bar is only for macOS: check it with --workspace there.
default-members = ["."]

# One version for the engine, the panel and the map: ./release changes it here.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alrubearb-sys/peakcast"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
