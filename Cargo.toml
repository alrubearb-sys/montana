[package]
name = "montana"
version = "0.1.0"
edition = "2024"
description = "Should I go to the mountains this weekend? Ranks your favourite ski and alpine areas by forecast."
license = "MIT OR Apache-2.0"
repository = "https://github.com/alrubearb-sys/montana"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }

[workspace]
members = ["bar"]
# The bar is only for macOS: check it with --workspace there.
default-members = ["."]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
