[package]
name = "peakcast-bar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Mac menu bar panel for peakcast."
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "~1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-path", "software-renderer-systemfonts", "system-tray", "image-default-formats", "unstable-winit-030"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSColorSpace", "NSEvent", "NSResponder", "NSScreen", "NSWindow"] }
